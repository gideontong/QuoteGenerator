<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css">
  <title>Random Quote Generator</title>
</head>

<body>
  <nav>
    <div class="nav-wrapper">
      <a href="#" class="brand-logo"> Gideon's Quote Generator</a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a href="http://gideon.splimtech.com">Website</a></li>
      </ul>
    </div>
  </nav>
  <br>
  <div class="row">
    <div class="col s12 m6">
      <div class="card blue-grey darken-1">
        <div class="card-content white-text">
          <span class="card-title">Quote</span>
          <span id="quote">f
        </span>
        </div>
        <div class="card-action">
          <button onclick="go()" id="new" class="btn btn-primary new">New Quote</button>
          <a class="twitter-share-button" href="https://twitter.com/intent/tweet?text=cool quote">Tweet me</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    function go() {
      var quotes = ["a by gid", "b by gid", "c by gid"]
      var i = Math.floor(Math.random() * 3);
      document.getElementById('quote').innerHTML = quotes[i];
    }
  </script>
</body>
</head>
